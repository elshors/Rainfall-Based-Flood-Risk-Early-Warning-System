<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flood Risk Admin Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ===== Report Cards ===== */
.report-summary {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
}

.report-card {
    flex: 1;
    background: #e0f7fa;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
}

.report-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

.report-card h3 {
    margin-bottom: 10px;
    font-size: 1.2rem;
    color: #00796b;
}

.report-card p {
    font-size: 1.5rem;
    font-weight: bold;
}

/* ===== Report Table ===== */
.report-table {
    width: 100%;
    border-collapse: collapse;
}

.report-table th, .report-table td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

.report-table th {
    background: #2f3c4f;
    color: white;
}

/* Filter section */
.report-filters {
    display: flex;
    gap: 15px;
    margin-bottom: 15px;
}

.report-filters select,
.report-filters input {
    padding: 8px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

.download-btn {
    background: #2f3c4f;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
}

.download-btn:hover {
    background: #004d40;
}

.report-filters .date-filter {
    display: flex;
    flex-direction: column;
    font-size: 0.9rem;
}

.report-filters .date-filter label {
    margin-bottom: 4px;
    color: #333;
}

.topbar {
    display: flex;
    justify-content: space-between; /* Pushes content to opposite ends */
    align-items: center;            /* Vertically centers items */
    padding: 10px 20px;
    background: #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

/* Header Text Styling */
.content-header h1 {
    font-size: 1.5rem;
    margin: 0;
    color: #333;
}

.content-header p {
    font-size: 0.85rem;
    margin: 0;
    color: #666;
}

/* Grouping Search and Profile on the Right */
.topbar-right {
    display: flex;
    align-items: center;
    gap: 20px; /* Space between search box and profile */
}

/* Ensure search box doesn't grow too large */
.search-box {
    position: relative;
    width: 250px;
}
</style>
<body>
<!-- SIDEBAR -->    
<div class="sidebar">
    <div class="sidebar-header">
        
        <br>
        <h2>Flood Watch <span>CDO</span></h2>
        <br><br>
    </div>
    
    <nav class="nav-menu">
        <a href="http://localhost/Version%202.1.6/dashboard.html" class="nav-item">
            <i class="fa-solid fa-chart-pie"></i>
            <span>Dashboard</span>
        </a>
        <a href="http://localhost/Version%202.1.6/barangay_page.html" class="nav-item">
            <i class="fa-solid fa-map-location-dot"></i>
            <span>Barangays</span>
        </a>
        <a href="http://localhost/Version%202.1.6/alert_page.html" class="nav-item">
            <i class="fa-solid fa-bell"></i>
            <span>Alerts</span>
        </a>
        
        <a href="http://localhost/Version%202.1.6/3_hr_forecast_page.html" class="nav-item">
            <i class="fa-solid fa-cloud-showers-heavy"></i>
            <span>3H Forecast</span>
        </a>
    
        <a href="http://localhost/Version%202.1.6/forecast_page.html" class="nav-item">
            <i class="fa-solid fa-cloud-showers-heavy"></i>
            <span>5-Day Forecast</span>
        </a>

        <a href="#" class="nav-item active">
            <i class="fa-solid fa-file-contract"></i>
            <span>Reports</span>
        </a>
        
        <a href="http://localhost/Version%202.1.6/log_page.html" class="nav-item">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Logs</span>
        </a>
    </nav>
</div>

<!-- MAIN CONTENT -->
<div class="main">

   <div class="topbar">
    <header class="content-header">
        <div>
            <h1>Reports Section</h1>
            <p>Historical Flood & Rainfall Data</p>
        </div>
    </header>

    <div class="topbar-right">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search barangay...">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
        </div>

        <div class="greeting">
            <div class="profile-circle">
                <i class="fa-solid fa-user"></i>
            </div>
            <div>
                <span>Hello there,</span>
                <h3 id="adminName">Admin</h3>
            </div>
        </div>
    </div>
</div>

     <!-- Summary Cards -->
    <div class="report-summary">
        <div class="report-card">
            <h3>Total Reports</h3>
            <p id="totalReports">0</p>
        </div>
        <div class="report-card">
            <h3>Most Flooded Barangay</h3>
            <p id="mostFlooded">None</p>
        </div>
        <div class="report-card">
            <h3>Reports This Month</h3>
            <p id="monthReports">0</p>
        </div>
    </div>

<!-- Filters -->
<div class="report-filters">
    <select id="barangayFilter">
        <option value="">All Barangays</option>
    </select>

    <div class="date-filter">
        <label for="startDate">Start Date:</label>
        <input type="date" id="startDate">
    </div>

    <div class="date-filter">
        <label for="endDate">End Date:</label>
        <input type="date" id="endDate">
    </div>

    <button id="download-btn"class="download-btn">Download CSV</button>
</div>

    <!-- Report Table -->
    <table class="report-table">
        <thead>
            <tr>
                <th>Barangay</th>
                <th>Date</th>
                <th>Rainfall (mm)</th>
                <th>Flood Risk Level</th>
            </tr>
        </thead>
        <tbody id="reportBody">
          
        </tbody>
    </table>

</div>
    <script src="report_page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flood Risk Admin Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>


  /* --- Main Content --- */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

 

  /* --- Logs Table --- */
  .content { padding: 20px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
  th { background: #2f3c4f; color: #fff; }
  tr:hover { background: #f1f1f1; }
  .status-success { color: green; font-weight: bold; }
  .status-failed { color: red; font-weight: bold; }
  .status-warning { color: orange; font-weight: bold; }

  /* --- Responsive --- */
  @media(max-width: 768px){
    .sidebar { width: 60px; }
    .sidebar h2 { display: none; }
    .sidebar a span { display: none; }
    .topbar .actions { flex-direction: column; gap: 5px; }
  }

  .topbar {
    display: flex;
    justify-content: space-between; /* Pushes content to opposite ends */
    align-items: center;            /* Vertically centers items */
    padding: 10px 20px;
    background: #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

/* Header Text Styling */
.content-header h1 {
    font-size: 1.5rem;
    margin: 0;
    color: #333;
}

.content-header p {
    font-size: 0.85rem;
    margin: 0;
    color: #666;
}

/* Grouping Search and Profile on the Right */
.topbar-right {
    display: flex;
    align-items: center;
    gap: 20px; /* Space between search box and profile */
}

/* Ensure search box doesn't grow too large */
.search-box {
    position: relative;
    width: 250px;
}
</style>
<body>

<!-- SIDEBAR -->    
<div class="sidebar">
    <div class="sidebar-header">
        
        <br>
        <h2>Flood Watch <span>CDO</span></h2>
        <br><br>
    </div>
    
    <nav class="nav-menu">
        <a href="http://localhost/Version%202.1.6/dashboard.html" class="nav-item ">
            <i class="fa-solid fa-chart-pie"></i>
            <span>Dashboard</span>
        </a>
        <a href="http://localhost/Version%202.1.6/barangay_page.html" class="nav-item">
            <i class="fa-solid fa-map-location-dot"></i>
            <span>Barangays</span>
        </a>
        <a href="http://localhost/Version%202.1.6/alert_page.html" class="nav-item">
            <i class="fa-solid fa-bell"></i>
            <span>Alerts</span>
        </a>
        <a href="http://localhost/Version%202.1.6/3_hr_forecast_page.html" class="nav-item">
            <i class="fa-solid fa-cloud-showers-heavy"></i>
            <span>3H Forecast</span>
        </a>
    
        <a href="http://localhost/Version%202.1.6/forecast_page.html" class="nav-item">
            <i class="fa-solid fa-cloud-showers-heavy"></i>
            <span>5-Day Forecast</span>
        </a>

        <a href="http://localhost/Version%202.1.6/report_page.html" class="nav-item">
            <i class="fa-solid fa-file-contract"></i>
            <span>Reports</span>
        </a>
        
        <a href="#" class="nav-item active">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Logs</span>
        </a>
    </nav>
</div>

<!-- MAIN CONTENT -->
<div class="main">

    <!-- TOPBAR -->
    <div class="topbar">
        <div class="content-header">
           <div>
                <h1>Action & System Logs</h1>
                <p>Monitor system activity, alerts, and administrative actions</p>
            </div> 
        </div>

        <div class="topbar-right">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search barangay...">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
            </div>

            <div class="greeting">
                <div class="profile-circle">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <span>Hello there,</span>
                    <h3 id="adminName">Admin</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Logs Table -->
    <div class="table-container">
        <div class="content">
            <table>
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>User</th>
                        <th>Action</th>
                        <th>Status</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody id="logBody">
                </tbody>
            </table>
        </div>
    </div>
</div>

    

    <script src="log_page.js"></script>

</body>
</html>
